<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>hello-wasm gamebaby example</title>
    <style>
    .root{
      display: flex;
      flex-direction: row;
    }
    .console{
      display: flex;
      flex-direction: column;
    }
    .input{
      display: flex;
      flex-direction: row;
    }
    .cursor{
      display: flex;
      flex-direction: column;
    }
    .left_right{
      display: flex;
      flex-direction: row;
    }
    #freq{
      width: 3em;
    }
    </style>
  </head>
  <body>
  <span class="root">
    <span class="console">

      <span>
        <input id="freq" type="number" max="800" min="1" value="320"/>Mhz
        <button id="run_btn">run</button>
        <button id="stop_btn">stop</button>
        <button id="resume_btn">resume</button>
        <button id="audio_btn">audio on/off</button>
      </span>

      <span>
        状態: <span id="status">stop</span>
        、
        REPORT: <span id="report"></span>
      </span>

      <canvas id="display" width="400" height="320">
      </canvas>

      <span class="input">
        <span class="cursor">
          <button id="up">↑</button>
          <span class="left_right">
            <button id="left">←</button>
            <button id="right">→</button>
          </span>
          <button id="down">↓</button>
        </span>
        <span class="fn">
          <button id="z">Z</button>
          <button id="x">X</button>
          <button id="c">C</button>
          <button id="v">V</button>
        </span>
      </span>

      <span>
      <hr>
ソースコードは<a href="https://github.com/mugisaku/gbcc-rust">https://github.com/mugisaku/gbcc-rust</a>
      </span>
    </span>
  <span>
    <textarea id="text" cols="48" rows="10">
    </textarea>
    <textarea id="asm_text" cols="48" rows="10">
    </textarea>
  </span>

    <script>function  check(s){console.log(s);}</script>
    <script type="module">
      import init, {
        get_byte,
        put_byte,
        get_word,
        put_word,
        set_input,
        get_input,
        get_data_address,
        get_const,
        process,
        get_error_message,
        transfer_ex_img,
        compile,
        setup } from "./pkg/gblib.js";

      let  g_text;
      let  g_asmtext;

      let  g_ready;
      let  g_timer_id;
      let  g_freq;

      const  REFRESH_RATE = 24;
      const  INTERVAL = 1000/REFRESH_RATE;

      let  g_cv;
      let  g_cvctx;
      let  g_imgdat;
      let  g_ex_img;
      let  g_ex_img_cv;
      let  g_ex_img_ctx;
      let  g_video_pitch;
      let  g_flip_counter;
      let  g_scr_addr;
      let  g_scrst_addr;

      let  g_actx;
      let  g_sin_osc;
      let  g_squ_osc;
      let  g_saw_osc;
      let  g_tri_osc;
      let  g_noi;
      let  g_noi_buf;
      let  g_noi_buf_size;
      let  g_sin_gain;
      let  g_squ_gain;
      let  g_saw_gain;
      let  g_tri_gain;
      let  g_noi_gain;

      let  g_key_state = 0;
      let  g_up_key;
      let  g_left_key;
      let  g_right_key;
      let  g_down_key;
      let  g_z_key;
      let  g_x_key;
      let  g_c_key;
      let  g_v_key;

      const  g_volume_max = 0.1;

      let  g_sin_freq_addr;
      let  g_sin_vol_addr ;
      let  g_squ_freq_addr;
      let  g_squ_vol_addr ;
      let  g_saw_freq_addr;
      let  g_saw_vol_addr ;
      let  g_tri_freq_addr;
      let  g_tri_vol_addr ;
      let  g_noi_vol_addr ;

      let  g_report_addr;
      let  g_report;

      function
      get_freq(addr)
      {
        const  n = Math.min(12*6,get_word(addr));

        return (440.0/4)*Math.pow(2,n/12)
      }

      function
      get_vol(addr)
      {
        return g_volume_max/256*Math.min(256,get_word(addr));
      }

      function
      update_audio()
      {
          if(g_actx)
          {
            g_sin_osc.frequency.value = get_freq(g_sin_freq_addr);
            g_squ_osc.frequency.value = get_freq(g_squ_freq_addr);
            g_saw_osc.frequency.value = get_freq(g_saw_freq_addr);
            g_tri_osc.frequency.value = get_freq(g_tri_freq_addr);

            g_sin_gain.gain.value = get_vol(g_sin_vol_addr);
            g_squ_gain.gain.value = get_vol(g_squ_vol_addr);
            g_saw_gain.gain.value = get_vol(g_saw_vol_addr);
            g_tri_gain.gain.value = get_vol(g_tri_vol_addr);
            g_noi_gain.gain.value = get_vol(g_noi_vol_addr);
          }
      }

      function
      switch_audio()
      {
          if(g_actx)
          {
              if(g_actx.state === "running")
              {
                g_actx.suspend();
              }

            else
              {
                g_actx.resume();
              }
          }

        else
          {
            start_audio();
          }
      }

      function
      fill_noise()
      {
        const  data = g_noi_buf.getChannelData(0);

          for(let  i = 0;  i < g_noi_buf_size;  ++i)
          {
            data[i] = Math.random()*2-1;
          }
      }

      function
      start_audio()
      {
          if(!g_actx)
          {
            g_actx = new AudioContext();

            g_noi_buf_size = g_actx.sampleRate*1024;

            g_sin_osc = new OscillatorNode(g_actx,{type:     "sine", frequency: 440});
            g_squ_osc = new OscillatorNode(g_actx,{type:   "square", frequency: 440});
            g_saw_osc = new OscillatorNode(g_actx,{type: "sawtooth", frequency: 440});
            g_tri_osc = new OscillatorNode(g_actx,{type: "triangle", frequency: 440});

            g_noi_buf = new AudioBuffer({length: g_noi_buf_size, sampleRate: g_actx.sampleRate});

            fill_noise();

            g_noi = new AudioBufferSourceNode(g_actx,{buffer: g_noi_buf});

            g_noi.loop = true;

            g_sin_gain = g_actx.createGain();
            g_squ_gain = g_actx.createGain();
            g_saw_gain = g_actx.createGain();
            g_tri_gain = g_actx.createGain();
            g_noi_gain = g_actx.createGain();

            g_sin_gain.gain.value = 0;
            g_squ_gain.gain.value = 0;
            g_saw_gain.gain.value = 0;
            g_tri_gain.gain.value = 0;
            g_noi_gain.gain.value = 0;

            g_sin_osc.connect(g_sin_gain).connect(g_actx.destination);
            g_squ_osc.connect(g_squ_gain).connect(g_actx.destination);
            g_saw_osc.connect(g_saw_gain).connect(g_actx.destination);
            g_tri_osc.connect(g_tri_gain).connect(g_actx.destination);
            g_noi.connect(g_noi_gain).connect(g_actx.destination);

            g_sin_osc.start();
            g_squ_osc.start();
            g_saw_osc.start();
            g_tri_osc.start();
            g_noi.start();
          }
      }


      function
      refresh()
      {
        set_input(g_key_state|0);

        process(g_freq,INTERVAL);

          if(get_word(g_scrst_addr))
          {
            put_word(g_scrst_addr,0);

            const  base = get_word(g_scr_addr);

            let  i = 0;

              for(let  y = 0;  y < g_imgdat.height;  ++y)
              {
                  for(let  x = 0;  x < g_imgdat.width;  ++x)
                  {
                    const  offset = 4*((g_video_pitch*y)+x);

                    const  pixel = get_word(base+offset);

                    g_imgdat.data[i  ] = (pixel>>24)&0xFF;
                    g_imgdat.data[i+1] = (pixel>>16)&0xFF;
                    g_imgdat.data[i+2] = (pixel>> 8)&0xFF;

                    i += 4;
                  }
              }


            g_cvctx.putImageData(g_imgdat,0,0);
          }


        update_audio();

        g_report.innerText = ""+get_word(g_report_addr);
      }


      function  get_ex_img_w(){return g_ex_img_w;}
      function  get_ex_img_h(){return g_ex_img_h;}
      function  get_ex_img_data(){return g_ex_img_data;}

      function
      run()
      {
        stop();

          if(!g_ready)
          {
            return;
          }


        const  ex_img_data = g_ex_img_ctx.getImageData(0,0,g_ex_img_cv.width,g_ex_img_cv.height);

        transfer_ex_img(g_ex_img.width,g_ex_img.height,ex_img_data.data);

          if(!compile(g_text.value))
          {
            g_asmtext.value = get_error_message();

            return;
          }


        g_asmtext.value = setup();


        g_scr_addr      = get_data_address("screen_address");
        g_scrst_addr    = get_data_address("screen_status");
        g_sin_freq_addr = get_data_address("sin_freq");
        g_sin_vol_addr  = get_data_address("sin_vol");
        g_squ_freq_addr = get_data_address("squ_freq");
        g_squ_vol_addr  = get_data_address("squ_vol");
        g_saw_freq_addr = get_data_address("saw_freq");
        g_saw_vol_addr  = get_data_address("saw_vol");
        g_tri_freq_addr = get_data_address("tri_freq");
        g_tri_vol_addr  = get_data_address("tri_vol");
        g_noi_vol_addr  = get_data_address("noi_vol");
        g_report_addr   = get_data_address("report");

        g_up_key    = get_const("UP_KEY");
        g_left_key  = get_const("LEFT_KEY");
        g_right_key = get_const("RIGHT_KEY");
        g_down_key  = get_const("DOWN_KEY");
        g_z_key     = get_const("Z_KEY");
        g_x_key     = get_const("X_KEY");
        g_c_key     = get_const("C_KEY");
        g_v_key     = get_const("V_KEY");

        g_cv.width  = get_const("SCREEN_W");
        g_cv.height = get_const("SCREEN_H");
        g_video_pitch = get_const("VIDEO_W");

        g_imgdat = g_cvctx.createImageData(g_cv.width,g_cv.height);

          for(let  i = 0|0;  i < (g_imgdat.width*g_imgdat.height);  ++i)
          {
            g_imgdat.data[(4*i)+3] = 255;
          }


        resume();
      }

      function
      stop()
      {
        clearInterval(g_timer_id)      ;
                      g_timer_id = null;

        document.getElementById("status").innerText = "stop";
      }

      function
      resume()
      {
          if(!g_ready)
          {
            return;
          }


        document.getElementById("status").innerText = "running";

        g_freq = parseInt(document.getElementById("freq").value,10)*1000*1000;

        g_freq /= REFRESH_RATE;

        g_timer_id = setInterval(refresh,INTERVAL);
      }


      init().then(async () => {
        g_cv = document.getElementById("display");

        g_cvctx = g_cv.getContext("2d");

        g_cvctx.fillStyle = "rgb(0,0,0)";

        g_cvctx.fillRect(0,0,g_cv.width,g_cv.height);


        g_report = document.getElementById("report");
        g_text = document.getElementById("text");
        g_asmtext = document.getElementById("asm_text");

        document.getElementById("run_btn").addEventListener("click",run);
        document.getElementById("stop_btn").addEventListener("click",stop);
        document.getElementById("resume_btn").addEventListener("click",resume);
        document.getElementById("audio_btn").addEventListener("click",switch_audio);

        document.getElementById("up").addEventListener("mousedown",function(){g_key_state |=  g_up_key;});
        document.getElementById("up").addEventListener(  "mouseup",function(){g_key_state &= ~g_up_key;});
        document.getElementById("left").addEventListener("mousedown",function(){g_key_state |=  g_left_key;});
        document.getElementById("left").addEventListener(  "mouseup",function(){g_key_state &= ~g_left_key;});
        document.getElementById("right").addEventListener("mousedown",function(){g_key_state |=  g_right_key;});
        document.getElementById("right").addEventListener(  "mouseup",function(){g_key_state &= ~g_right_key;});
        document.getElementById("down").addEventListener("mousedown",function(){g_key_state |=  g_down_key;});
        document.getElementById("down").addEventListener(  "mouseup",function(){g_key_state &= ~g_down_key;});
        document.getElementById("z").addEventListener("mousedown",function(){g_key_state |=  g_z_key;});
        document.getElementById("z").addEventListener(  "mouseup",function(){g_key_state &= ~g_z_key;});
        document.getElementById("x").addEventListener("mousedown",function(){g_key_state |=  g_x_key;});
        document.getElementById("x").addEventListener(  "mouseup",function(){g_key_state &= ~g_x_key;});
        document.getElementById("c").addEventListener("mousedown",function(){g_key_state |=  g_c_key;});
        document.getElementById("c").addEventListener(  "mouseup",function(){g_key_state &= ~g_c_key;});
        document.getElementById("v").addEventListener("mousedown",function(){g_key_state |=  g_v_key;});
        document.getElementById("v").addEventListener(  "mouseup",function(){g_key_state &= ~g_v_key;});

        document.addEventListener("keydown",function(evt){
            switch(evt.code)
            {
          case    "ArrowUp": g_key_state |=    g_up_key;break;
          case  "ArrowLeft": g_key_state |=  g_left_key;break;
          case "ArrowRight": g_key_state |= g_right_key;break;
          case  "ArrowDown": g_key_state |=  g_down_key;break;
          case  "KeyZ": g_key_state |= g_z_key;break;
          case  "KeyX": g_key_state |= g_x_key;break;
          case  "KeyC": g_key_state |= g_c_key;break;
          case  "KeyV": g_key_state |= g_v_key;break;
            }
        });

        document.addEventListener("keyup",function(evt){
            switch(evt.code)
            {
          case    "ArrowUp": g_key_state &=    ~g_up_key;break;
          case  "ArrowLeft": g_key_state &=  ~g_left_key;break;
          case "ArrowRight": g_key_state &= ~g_right_key;break;
          case  "ArrowDown": g_key_state &=  ~g_down_key;break;
          case  "KeyZ": g_key_state &= ~g_z_key;break;
          case  "KeyX": g_key_state &= ~g_x_key;break;
          case  "KeyC": g_key_state &= ~g_c_key;break;
          case  "KeyV": g_key_state &= ~g_v_key;break;
            }
        });


        g_ex_img = new Image();

        g_ex_img.onload = function(){
          g_ex_img_cv = document.createElement("canvas");

          g_ex_img_cv.width  = g_ex_img.width;
          g_ex_img_cv.height = g_ex_img.height;

          g_ex_img_ctx = g_ex_img_cv.getContext("2d");

          g_ex_img_ctx.drawImage(g_ex_img,0,0);

          g_ready |= 1;

        };

        g_ex_img.src = "chr.png";


        const  response = await fetch("./gamebaby_sample.txt");
        const  result = await response.text();

        g_text.value = result;
      });
    </script>
  </body>
</html>
